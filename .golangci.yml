version: "2"
run:
  go: "1.26"
linters:
  default: none
  enable:
    - dupword
    - errcheck
    - gocognit
    - misspell
    - nilerr
    - staticcheck
    - unused
    - whitespace
  settings:
    dupword:
      # Repeated names in the consensus spec pseudo-code quoted in comments.
      ignore:
        - state.next_sync_committee
        - state.current_epoch_participation
        - state.current_epoch_attestations
        - total,
    gocognit:
      min-complexity: 65
    misspell:
      locale: US
    staticcheck:
      # golangci-lint v1 ran only gosimple; v2 merges it into staticcheck.
      checks:
        - S*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # A receive from a subscription error channel only signals that the
      # subscription is closed; the error value is not needed.
      - linters:
          - errcheck
        source: <-\s*[\w.]*(Err\(\)|err)\s*($|:)
    paths:
      - (^|/)third_party/
      - (^|/)builtin/
      - (^|/)examples/
      # Kept from the v1 configuration (run.skip-files and run.skip-dirs).
      - .*_test.go
      - beacon-chain/powchain/testing
      - beacon-chain/p2p/testing
      - beacon-chain/blockchain/testing
      - proto/
      - contracts/
      - testing/
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - (^|/)third_party/
      - (^|/)builtin/
      - (^|/)examples/
      - proto/
      - contracts/
      - testing/
