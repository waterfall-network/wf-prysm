version: "2"
run:
  go: "1.26"
linters:
  default: none
  enable:
    - dupword
    - errcheck
    - gocognit
    - misspell
    - nilerr
    - staticcheck
    - unused
    - whitespace
  settings:
    gocognit:
      min-complexity: 65
    misspell:
      locale: US
    staticcheck:
      # golangci-lint v1 ran only gosimple; v2 merges it into staticcheck.
      checks:
        - S*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - (^|/)third_party/
      - (^|/)builtin/
      - (^|/)examples/
      # Kept from the v1 configuration (run.skip-files and run.skip-dirs).
      - .*_test.go
      - beacon-chain/powchain/testing
      - beacon-chain/p2p/testing
      - beacon-chain/blockchain/testing
      - proto/
      - contracts/
      - testing/
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - (^|/)third_party/
      - (^|/)builtin/
      - (^|/)examples/
      - proto/
      - contracts/
      - testing/
