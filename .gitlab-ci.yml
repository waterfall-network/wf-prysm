stages:
  - lint
  - test
  - build
  - release

variables:
  # gwat is the license-separated fork wf-go-ethereum. Its module path (.../gwat)
  # differs from its repo URL, so it cannot be resolved via the module proxy — CI
  # clones it next to this repo and go.mod keeps a local `replace` pointing there.
  # (wf-types, by contrast, resolves normally via its published tag over the proxy.)
  # Set WF_GOETH_TAG to the wf-go-ethereum release tag (override via a CI/CD variable).
  WF_GOETH_TAG: "v0.1.0"

# Dependency setup shared by every job that compiles Go (lint, test, build).
.go_deps: &go_deps |-
  echo "machine $CI_SERVER_HOST login gitlab-ci-token password $CI_JOB_TOKEN" >> ~/.netrc
  export GOPRIVATE=${CI_SERVER_HOST}
  # The shell runner's system go is 1.19, but go.mod needs 1.21 (log/slog et al.).
  # Activate Go 1.21 via GVM installed on the runner host, same as wf-go-ethereum.
  source ~/.gvm/scripts/gvm || echo "Failed to source GVM"
  gvm use go1.21.12 --default || echo "Failed to use GVM"
  go version
  # gwat -> clone the fork; the local `replace` in go.mod points at ../wf-go-ethereum.
  # rm -rf first: the runner may reuse the build dir across jobs, leaving a stale clone.
  rm -rf ../wf-go-ethereum && git clone --depth 1 --branch "$WF_GOETH_TAG" "https://${CI_SERVER_HOST}/waterfall/protocol/wf-go-ethereum.git" ../wf-go-ethereum
  # wf-types / wf-consensus -> resolve via their published tags over the authenticated
  # proxy (like the sibling repos); drop the local dev replaces so CI fetches the
  # versions pinned in go.mod.
  go mod edit -dropreplace=gitlab.waterfall.network/waterfall/protocol/wf-types
  go mod edit -dropreplace=gitlab.waterfall.network/waterfall/protocol/wf-consensus
  # committed go.sum predates the dep swap; -mod=mod lets go add the missing wf-types
  # proxy checksum (and any wf-go-ethereum transitive entries) on demand.
  export GOFLAGS=-mod=mod

.job_build:
  script: &job_build
    - *go_deps
    - mkdir -p ./dist
    - cp runtime/version/version.go /tmp/version.go
    - sed -i "s/\\\u2692/${CI_COMMIT_SHORT_SHA}/g" runtime/version/version.go
    - go build -trimpath -ldflags="-s -w" -o ./dist/coordinator-beacon   ./cmd/beacon-chain
    - go build -trimpath -ldflags="-s -w" -o ./dist/coordinator-validator ./cmd/validator
    - go build -trimpath -ldflags="-s -w" -o ./dist/coordinator-bootnode  ./tools/bootnode
    - go build -trimpath -ldflags="-s -w" -o ./dist/coordinator-genesis   ./tools/genesis-state-gen
    - cp -r /tmp/version.go runtime/version/version.go

lint:
  stage: lint
  image: golangci/golangci-lint:v1.52.2
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG == null
      when: on_success
  before_script:
    # golangci-lint must resolve exactly the same deps as the build.
    - *go_deps
  script:
    - echo "SKIP"
    - golangci-lint run -v --out-format=github-actions --config=.golangci.yml --out-format colored-line-number

test:
  stage: test
  tags:
    - bazel
  rules:
    - if: $CI_COMMIT_TAG == null
      when: on_success
  script:
    # Tests stay on bazel: a large part of the suite (spectest, testing/bls,
    # config/params, EIP-3076 tests) locates its fixtures via bazel runfiles and
    # cannot run under plain `go test`.
    - echo "machine $CI_SERVER_HOST login gitlab-ci-token password $CI_JOB_TOKEN" >> ~/.netrc
    - export GOPRIVATE=${CI_SERVER_HOST}
    - bazel version
    - bazel test //api/...
    - bazel test //async/...
    - bazel test //cache/...
    - bazel test //cmd/...
    - bazel test //config/...
    - bazel test //container/...
    - bazel test //crypto/...
    - bazel test //encoding/...
    - bazel test //io/...
    - bazel test //math/...
    - bazel test //monitoring/...
    - bazel test //network/...
    - bazel test //proto/...
    - bazel test //runtime/...
    - bazel test //testing/...
    - bazel test //third_party/...
    - bazel test //time/...
    - bazel test //tools/...
    - bazel test //validator/...
    - bazel test //beacon-chain/blockchain/...
    - bazel test //beacon-chain/cache/...
    - bazel test //beacon-chain/core/...
    - bazel test //beacon-chain/db/...
    - bazel test //beacon-chain/forkchoice/...
    - bazel test //beacon-chain/gateway/...
    - bazel test //beacon-chain/monitor/...
    - bazel test //beacon-chain/node/...
    - bazel test //beacon-chain/operations/...
    #- bazel test //beacon-chain/p2p/...
    - bazel test //beacon-chain/powchain/...
    - bazel test //beacon-chain/rpc/...
    - bazel test //beacon-chain/slasher/...
    - bazel test //beacon-chain/state/...
    - bazel test //beacon-chain/sync/...
    #- bazel test //build/...

build branch:
  stage: build
  tags:
    - bazel
  rules:
    - if: $CI_COMMIT_REF_NAME != "main" && $CI_COMMIT_TAG == null
      when: on_success
  script: *job_build
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME"
    paths:
      - dist/coordinator-beacon
      - dist/coordinator-validator
      - dist/coordinator-bootnode
      - dist/coordinator-genesis

build latest:
  stage: build
  tags:
    - bazel
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      when: on_success
  script: *job_build
  artifacts:
    name: "$CI_PROJECT_NAME-latest"
    paths:
      - dist/coordinator-beacon
      - dist/coordinator-validator
      - dist/coordinator-bootnode
      - dist/coordinator-genesis

release tag:
  stage: build
  tags:
    - bazel
  rules:
    - if: $CI_COMMIT_TAG != null
      when: on_success
  script: *job_build
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_BUILD_TAG"
    paths:
      - dist/coordinator-beacon
      - dist/coordinator-validator
      - dist/coordinator-bootnode
      - dist/coordinator-genesis

after_script:
  - rm ~/.netrc