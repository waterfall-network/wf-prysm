stages:
  - lint
  - test
  - build
  - release

variables:
  # gwat is the license-separated fork wf-go-ethereum. Its module path (.../gwat)
  # differs from its repo URL, so it cannot be resolved via the module proxy — CI
  # clones it next to this repo and go.mod keeps a local `replace` pointing there.
  # Set WF_GOETH_TAG to the wf-go-ethereum release tag or branch (override via a
  # CI/CD variable). Tags up to v0.1.0 predate the iguazu-* module rename.
  WF_GOETH_TAG: "main"

# Dependency setup shared by every job that compiles Go (lint, test, build).
.go_deps: &go_deps |-
  echo "machine $CI_SERVER_HOST login gitlab-ci-token password $CI_JOB_TOKEN" >> ~/.netrc
  export GOPRIVATE=${CI_SERVER_HOST}
  # The shell runner's system go is 1.19, but go.mod needs 1.21 (log/slog et al.).
  # Activate Go 1.21 via GVM installed on the runner host, same as wf-go-ethereum.
  source ~/.gvm/scripts/gvm || echo "Failed to source GVM"
  gvm use go1.21.12 --default || echo "Failed to use GVM"
  go version
  # gwat -> clone the fork; the local `replace` in go.mod points at ../wf-go-ethereum.
  # rm -rf first: the runner may reuse the build dir across jobs, leaving a stale clone.
  rm -rf ../wf-go-ethereum && git clone --depth 1 --branch "$WF_GOETH_TAG" "https://${CI_SERVER_HOST}/waterfall/protocol/wf-go-ethereum.git" ../wf-go-ethereum
  # iguazu-types / iguazu-consensus -> not yet published at github.com/LFDT-Iguazu;
  # clone them next to this repo for the local `replace`s in go.mod (wf-go-ethereum
  # resolves iguazu-types the same way).
  rm -rf ../iguazu-types && git clone --depth 1 "https://${CI_SERVER_HOST}/waterfall/protocol/iguazu/iguazu-types.git" ../iguazu-types
  rm -rf ../iguazu-consensus && git clone --depth 1 "https://${CI_SERVER_HOST}/waterfall/protocol/iguazu/iguazu-consensus.git" ../iguazu-consensus
  # -mod=mod lets go add any missing go.sum entries (e.g. wf-go-ethereum
  # transitive deps) on demand.
  export GOFLAGS=-mod=mod
  # herumi BLS (crypto/bls) links C++ via `-lstdc++`, but the runner has only the
  # runtime libstdc++.so.6, not the dev symlink `libstdc++.so` (no g++ installed).
  # Provide the symlink in a writable dir and point the linker at it, no root needed;
  # linking against .so.6 is fine since it's present at runtime too. Locate the lib
  # via gcc (the cgo compiler, always on PATH) since ldconfig isn't in the runner's PATH.
  CXX6=$(gcc -print-file-name=libstdc++.so.6)
  [ -e "$CXX6" ] || CXX6=$(find /usr/lib /usr/lib64 /lib -name 'libstdc++.so.6' 2>/dev/null | head -n1)
  mkdir -p /tmp/cxxlib && ln -sf "$CXX6" /tmp/cxxlib/libstdc++.so
  export CGO_LDFLAGS="-L/tmp/cxxlib"

.job_build:
  script: &job_build
    - *go_deps
    - mkdir -p ./dist
    - cp runtime/version/version.go /tmp/version.go
    - sed -i "s/\\\u2692/${CI_COMMIT_SHORT_SHA}/g" runtime/version/version.go
    - go build -trimpath -ldflags="-s -w" -o ./dist/coordinator-beacon   ./cmd/beacon-chain
    - go build -trimpath -ldflags="-s -w" -o ./dist/coordinator-validator ./cmd/validator
    - go build -trimpath -ldflags="-s -w" -o ./dist/coordinator-bootnode  ./tools/bootnode
    - go build -trimpath -ldflags="-s -w" -o ./dist/coordinator-genesis   ./tools/genesis-state-gen
    - cp -r /tmp/version.go runtime/version/version.go

lint:
  stage: lint
  image: golangci/golangci-lint:v1.52.2
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG == null
      when: on_success
  before_script:
    # golangci-lint must resolve exactly the same deps as the build.
    - *go_deps
  script:
    - echo "SKIP"
    - golangci-lint run -v --out-format=github-actions --config=.golangci.yml --out-format colored-line-number

test:
  stage: test
  tags:
    - bazel
  rules:
    - if: $CI_COMMIT_TAG == null
      when: on_success
  script:
    - *go_deps
    # Spec-test fixtures that bazel provides as runfiles are instead extracted into
    # $WF_TESTDATA_DIR, which the testing/runfile shim resolves under `go test`. The
    # same URLs bazel fetches via http_archive (see WORKSPACE.bazel); the runner can
    # already reach them. macOS `._*` metadata in the mainnet archive is stripped.
    - |
      dl() { curl -fsSL "$1" 2>/dev/null || wget -qO- "$1"; }
      export WF_TESTDATA_DIR="$CI_PROJECT_DIR/.testdata"
      rm -rf "$WF_TESTDATA_DIR" && mkdir -p "$WF_TESTDATA_DIR/external" "$WF_TESTDATA_DIR/eip3076_spec_tests"
      dl https://storage.waterfall.network/spec_tests/v0.0.4/general.tar.gz | tar -xz -C "$WF_TESTDATA_DIR"
      dl https://storage.waterfall.network/spec_tests/v0.0.4/mainnet.tar.gz | tar -xz -C "$WF_TESTDATA_DIR"
      dl https://github.com/ethereum/bls12-381-tests/releases/download/v0.1.1/bls_tests_yaml.tar.gz | tar -xz -C "$WF_TESTDATA_DIR"
      dl https://github.com/eth-clients/slashing-protection-interchange-tests/archive/b8413ca42dc92308019d0d4db52c87e9e125c4e9.tar.gz | tar -xz -C "$WF_TESTDATA_DIR/eip3076_spec_tests" --strip-components=1
      dl https://github.com/eth-clients/eth2-networks/archive/791a5369c5981e829698b17fbcdcdacbdaba97c8.tar.gz | tar -xz -C "$WF_TESTDATA_DIR/external"
      mv "$WF_TESTDATA_DIR/external/eth2-networks-791a5369c5981e829698b17fbcdcdacbdaba97c8" "$WF_TESTDATA_DIR/external/eth2_networks"
      find "$WF_TESTDATA_DIR" -name '._*' -delete
    # -tags develop mirrors prysm's test build (checktags_test.go requires it). Each
    # go package compiles to its own test binary (separate process), so global state
    # can't leak across packages. Exclusions mirror the old bazel allowlist (p2p and
    # build were already skipped) plus targets that can't run under plain go test:
    # testing/endtoend & testing/benchmark (need external binaries / prebuilt data)
    # and tools/analyzers (nogo static analyzers that don't build outside bazel).
    - |
      PKGS=$(go list ./... | grep -vE '/testing/endtoend|/testing/benchmark|/beacon-chain/p2p($|/)|/tools/analyzers($|/)|/build($|/)')
      go test -tags develop $PKGS

build branch:
  stage: build
  tags:
    - bazel
  rules:
    - if: $CI_COMMIT_REF_NAME != "main" && $CI_COMMIT_TAG == null
      when: on_success
  script: *job_build
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME"
    paths:
      - dist/coordinator-beacon
      - dist/coordinator-validator
      - dist/coordinator-bootnode
      - dist/coordinator-genesis

build latest:
  stage: build
  tags:
    - bazel
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      when: on_success
  script: *job_build
  artifacts:
    name: "$CI_PROJECT_NAME-latest"
    paths:
      - dist/coordinator-beacon
      - dist/coordinator-validator
      - dist/coordinator-bootnode
      - dist/coordinator-genesis

release tag:
  stage: build
  tags:
    - bazel
  rules:
    - if: $CI_COMMIT_TAG != null
      when: on_success
  script: *job_build
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_BUILD_TAG"
    paths:
      - dist/coordinator-beacon
      - dist/coordinator-validator
      - dist/coordinator-bootnode
      - dist/coordinator-genesis

after_script:
  - rm ~/.netrc